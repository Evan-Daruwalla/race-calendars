name: build calendars

on:
  schedule:
    - cron: "17 11 * * *" # daily, 11:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/**", "racecal/**", "*-2026-27/**", "update_calendars.py", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One entry point. It builds and verifies every series before publishing any of them,
      # so a failure in the last series cannot leave the first four updated and the rest stale.
      - run: python update_calendars.py --yes
      # GitHub disables scheduled workflows in public repos after 60 days with no activity.
      # One small commit on the 1st of each month keeps the daily rebuild alive through the off-season.
      - name: monthly heartbeat
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then date -u +%Y-%m-%d > docs/heartbeat.txt; fi
      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || { git commit -m "Update calendars $(date -u +%Y-%m-%d)"; git push; }
