# --- 2026 remaining rounds (sessions) ---
# TIME-ZONE TRAP (verified 2026-09-11 ~04:12 UTC): the startDate values on fiawec.com race pages
# carry a Paris offset (+02:00 / +01:00), but the clock time is the TRACK's local time. Each page's
# live countdown proves it:
#   Fuji FP1 countdown -> 01:14 UTC = 10:15 Japan time (the label would give 08:15 UTC)
#   Bahrain FP1        -> 09:15 UTC = 12:15 Bahrain time (the label would give 11:15 UTC)
#   Barcelona FP1      -> 09:00 UTC (same either way: Spain uses Paris time)
# So the times below are the published clock times with the track's real offset.
# Qualifying/Hyperpole minutes (20) = the published gap between consecutive session starts.
# The final Hyperpole's 20 is an estimate; practice uses the 60-minute default (an estimate).

[[event]]
season = 2026
name = "6 Hours of Fuji"
location = "Fuji Speedway, Japan"
source = "https://www.fiawec.com/en/race/6-hours-of-fuji-2026"
session = [
  { name = "Free Practice 1", start = 2026-09-25T10:15:00+09:00 },
  { name = "Free Practice 2", start = 2026-09-25T14:30:00+09:00 },
  { name = "Free Practice 3", start = 2026-09-26T09:30:00+09:00 },
  { name = "Qualifying - LMGT3", start = 2026-09-26T14:00:00+09:00, minutes = 20 },
  { name = "Hyperpole - LMGT3", start = 2026-09-26T14:20:00+09:00, minutes = 20 },
  { name = "Qualifying - Hypercar", start = 2026-09-26T14:40:00+09:00, minutes = 20 },
  { name = "Hyperpole - Hypercar", start = 2026-09-26T15:00:00+09:00, minutes = 20 },
  { name = "Race", start = 2026-09-27T11:00:00+09:00, minutes = 360 },
]

